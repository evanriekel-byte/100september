name = "hundred-mile-september"
main = "src/index.js"
compatibility_date = "2025-08-01"

# The challenge itself. Change these and redeploy to run it in another month,
# at another distance, or in kilometres.
[vars]
GOAL  = "100"
START = "2026-09-01"
END   = "2026-09-30"
UNIT  = "mi"

# Created by:  npx wrangler d1 create hundred-mile-september
# Paste the database_id it prints in here.
[[d1_databases]]
binding       = "DB"
database_name = "hundred-mile-september"
database_id   = "PASTE_YOUR_DATABASE_ID_HERE"
